<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable variant: all artwork sits inside the centred 80% safe circle
    (radius 205 around 256,256) so Android can crop it to any shape.
  -->
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#1e2b45"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(298 292) rotate(14)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#violet)"/>
    <circle cx="48" cy="48" r="11" fill="#1e1b3a"/>
    <circle cx="24" cy="24" r="11" fill="#1e1b3a"/>
    <circle cx="72" cy="72" r="11" fill="#1e1b3a"/>
  </g>

  <g transform="translate(132 142) rotate(-8)">
    <rect x="0" y="0" width="172" height="172" rx="38" fill="url(#orange)"/>
    <g fill="#3d1a06">
      <circle cx="48" cy="48" r="17"/>
      <circle cx="124" cy="48" r="17"/>
      <circle cx="86" cy="86" r="17"/>
      <circle cx="48" cy="124" r="17"/>
      <circle cx="124" cy="124" r="17"/>
    </g>
  </g>
</svg>
